# The Arcana server. This is the only server this client connects to.
#
# expressing-alcoholic.tun.ply.gg is the playit.gg tunnel that fronts the home
# server, which sits behind Starlink's CGNAT and takes no inbound port of its
# own. Since 2026-09-25 it runs on playit's Europe (UK) region.
#
# No port: the Play button asks the tunnel's SRV record for the port it
# publishes today, because playit moved it (25197 -> 48467) when the region
# changed and a stated port went dark. A port set here is used only when the
# host publishes no SRV record.
host=expressing-alcoholic.tun.ply.gg

# nightDarkness  how hard the night presses, 0 to 1. 0.30 is the 1.0.1 value:
#                clearly darker than vanilla, still walkable. Change it in game
#                with /arcanahud night [0..1].
nightDarkness=0.3

# heldLightSmoothing  how finely a carried lamp moves between blocks, 1 to 16.
#                     1 is block-by-block and flickers as you walk; higher is
#                     smoother and costs more chunk rebuilds.
#                     /arcanahud light [1..16].
heldLightSmoothing=2

# titleStyle  which of the title screen's button looks to draw. Empty is shipped.
titleStyle=
